name: media-standalone
x-media-logging: &media-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  init-qbittorrent:
    image: ${MEDIA_LOCAL_IMAGE:-${MEDIA_IMAGE:-media-mcp:local}}
    profiles: [setup]
    env_file: .env
    environment:
      MEDIA_TORRENT_PORT: ${MEDIA_TORRENT_PORT:-48181}
      QBITTORRENT_CONFIG_DIR: /services/qbittorrent
      MEDIA_DATA_ROOT: /data
    command: ["python3", "-m", "media_mcp.bootstrap", "qbittorrent"]
    volumes:
      - ${MEDIA_LOCAL_DATA_DIR:-${MEDIA_DATA_DIR:-./data}}:/data
      - ${MEDIA_SERVICES_DIR:-./services}/qbittorrent:/services/qbittorrent
  init-jackett:
    image: ${MEDIA_LOCAL_IMAGE:-${MEDIA_IMAGE:-media-mcp:local}}
    profiles: [setup]
    env_file: .env
    environment:
      JACKETT_CONFIG_FILE: /services/jackett/Jackett/ServerConfig.json
    command: ["python3", "-m", "media_mcp.bootstrap", "jackett"]
    volumes:
      - ${MEDIA_JACKETT_CONFIG_DIR:-${MEDIA_SERVICES_DIR:-./services}/jackett}:/services/jackett
  qbittorrent:
    profiles: [bundled-qbittorrent]
    image: ${QBITTORRENT_IMAGE:-linuxserver/qbittorrent:latest}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      TZ: ${TZ:-Asia/Shanghai}
      WEBUI_PORT: "8080"
      TORRENTING_PORT: ${MEDIA_TORRENT_PORT:-48181}
    ports:
      - "${MEDIA_ADMIN_BIND:-127.0.0.1}:${MEDIA_QBITTORRENT_PORT:-18211}:8080"
      - "${MEDIA_TORRENT_PORT:-48181}:${MEDIA_TORRENT_PORT:-48181}"
      - "${MEDIA_TORRENT_PORT:-48181}:${MEDIA_TORRENT_PORT:-48181}/udp"
    volumes:
      - ${MEDIA_SERVICES_DIR:-./services}/qbittorrent:/config
      - ${MEDIA_LOCAL_DATA_DIR:-${MEDIA_DATA_DIR:-./data}}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v2/app/version >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *media-logging
  jackett:
    profiles: [bundled-jackett]
    image: ${JACKETT_IMAGE:-linuxserver/jackett:latest}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      TZ: ${TZ:-Asia/Shanghai}
      AUTO_UPDATE: "false"
    ports:
      - "${MEDIA_ADMIN_BIND:-127.0.0.1}:${MEDIA_JACKETT_PORT:-18212}:9117"
    volumes:
      - ${MEDIA_JACKETT_CONFIG_DIR:-${MEDIA_SERVICES_DIR:-./services}/jackett}:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9117/UI/Dashboard >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *media-logging
  local-mcp:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        MEDIA_BASE_IMAGE: ${MEDIA_BASE_IMAGE:-python:3.12-slim-bookworm}
        INSTALL_OCR: ${INSTALL_OCR:-true}
    image: ${MEDIA_LOCAL_IMAGE:-${MEDIA_IMAGE:-media-mcp:local}}
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment: &media-environment
      MEDIA_LOCAL_DATA_DIR: ${MEDIA_LOCAL_DATA_DIR:-${MEDIA_DATA_DIR:-./data}}
      MEDIA_LOCAL_MCP_BIND: ${MEDIA_LOCAL_MCP_BIND:-${MEDIA_LAN_BIND:-0.0.0.0}}
      MEDIA_LOCAL_MCP_PORT: ${MEDIA_LOCAL_MCP_PORT:-${MEDIA_MCP_PORT:-18210}}
      MEDIA_AUTH_MODE: ${MEDIA_AUTH_MODE:-none}
      MEDIA_BIND_HOST: ${MEDIA_LOCAL_MCP_BIND:-${MEDIA_LAN_BIND:-0.0.0.0}}
      MEDIA_MCP_PORT: ${MEDIA_LOCAL_MCP_PORT:-${MEDIA_MCP_PORT:-18210}}
      MEDIA_DB_PATH: /state/media.sqlite3
      MEDIA_SERVICE_PAIRING: ${MEDIA_SERVICE_PAIRING:-false}
      QBITTORRENT_URL: ${QBITTORRENT_URL:-http://127.0.0.1:${MEDIA_QBITTORRENT_PORT:-18211}}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      JACKETT_URL: ${JACKETT_URL:-http://127.0.0.1:${MEDIA_JACKETT_PORT:-18212}}
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      JACKETT_CONFIG_FILE: /services/jackett/Jackett/ServerConfig.json
      CODEX_APP_SERVER_TOKEN_FILE: /run/secrets/codex-app-server-token
      MEDIA_CONTROL_TOKEN_FILE: /run/secrets/media-control-token
      MEDIA_CATALOG_URL: ${MEDIA_CATALOG_URL:-}
      MEDIA_EXECUTION_ONLY: ${MEDIA_EXECUTION_ONLY:-false}
      MEDIA_CLOUD_CONTROL_URL: ""
      MEDIA_CLOUD_CONTROL_PORT: ""
      MEDIA_CONTROL_URL: ""
      MEDIA_CONTROL_PORT: ""
    volumes: &media-volumes
      - ${MEDIA_LOCAL_DATA_DIR:-${MEDIA_DATA_DIR:-./data}}:/data
      - ${MEDIA_LOCAL_STATE_PATH:-${MEDIA_STATE_PATH:-./state}}:/state
      - ${MEDIA_JACKETT_CONFIG_DIR:-${MEDIA_SERVICES_DIR:-./services}/jackett}:/services/jackett:ro
      - type: bind
        source: ${CODEX_TOKEN_FILE:-./state/codex-token}
        target: /run/secrets/codex-app-server-token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_CONTROL_TOKEN_FILE:-./state/control-token}
        target: /run/secrets/media-control-token
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('MEDIA_MCP_PORT','18210')+'/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    command: ["media-local-mcp"]
    logging: *media-logging
  local-control:
    image: ${MEDIA_LOCAL_IMAGE:-${MEDIA_IMAGE:-media-mcp:local}}
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      <<: *media-environment
      MEDIA_LOCAL_CONTROL_BIND: ${MEDIA_LOCAL_CONTROL_BIND:-${MEDIA_WEB_BIND_HOST:-0.0.0.0}}
      MEDIA_LOCAL_CONTROL_PORT: ${MEDIA_LOCAL_CONTROL_PORT:-${MEDIA_WEB_PORT:-18213}}
      MEDIA_WEB_BIND_HOST: ${MEDIA_LOCAL_CONTROL_BIND:-${MEDIA_WEB_BIND_HOST:-0.0.0.0}}
      MEDIA_WEB_PORT: ${MEDIA_LOCAL_CONTROL_PORT:-${MEDIA_WEB_PORT:-18213}}
    volumes: *media-volumes
    command: ["media-local-control"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request;h=os.environ.get('MEDIA_WEB_BIND_HOST','127.0.0.1');h='127.0.0.1' if h in ('0.0.0.0','::') else h;h='['+h+']' if ':' in h else h;urllib.request.urlopen('http://'+h+':'+os.environ.get('MEDIA_WEB_PORT','18213')+'/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *media-logging
  local-worker:
    image: ${MEDIA_LOCAL_IMAGE:-${MEDIA_IMAGE:-media-mcp:local}}
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment: *media-environment
    volumes: *media-volumes
    command: ["media-local-worker"]
    stop_grace_period: 30s
    cpus: 1
    healthcheck:
      test: ["CMD", "python3", "-m", "media_mcp.monitor.health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *media-logging
