name: media-standalone
services:
  init:
    image: ${MEDIA_IMAGE:-media-mcp:local}
    profiles: [setup]
    env_file: .env
    environment:
      MEDIA_TORRENT_PORT: ${MEDIA_TORRENT_PORT:-48181}
    command: ["python3", "-m", "media_mcp.bootstrap"]
    volumes:
      - ${MEDIA_DATA_DIR:-./data}:/data
      - ${MEDIA_SERVICES_DIR:-./services}/qbittorrent:/services/qbittorrent
      - ${MEDIA_SERVICES_DIR:-./services}/jackett:/services/jackett
  qbittorrent:
    image: ${QBITTORRENT_IMAGE:-linuxserver/qbittorrent:latest}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      TZ: ${TZ:-Asia/Shanghai}
      WEBUI_PORT: "8080"
      TORRENTING_PORT: ${MEDIA_TORRENT_PORT:-48181}
    ports:
      - "${MEDIA_LAN_BIND:-0.0.0.0}:${MEDIA_QBITTORRENT_PORT:-18211}:8080"
      - "${MEDIA_TORRENT_PORT:-48181}:${MEDIA_TORRENT_PORT:-48181}"
      - "${MEDIA_TORRENT_PORT:-48181}:${MEDIA_TORRENT_PORT:-48181}/udp"
    volumes:
      - ${MEDIA_SERVICES_DIR:-./services}/qbittorrent:/config
      - ${MEDIA_DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v2/app/version >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: &media-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  jackett:
    image: ${JACKETT_IMAGE:-linuxserver/jackett:latest}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      TZ: ${TZ:-Asia/Shanghai}
      AUTO_UPDATE: "false"
    ports:
      - "${MEDIA_LAN_BIND:-0.0.0.0}:${MEDIA_JACKETT_PORT:-18212}:9117"
    volumes:
      - ${MEDIA_SERVICES_DIR:-./services}/jackett:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9117/UI/Dashboard >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *media-logging
  mcp:
    build:
      context: .
      args:
        MEDIA_BASE_IMAGE: ${MEDIA_BASE_IMAGE:-python:3.12-slim-bookworm}
        INSTALL_OCR: ${INSTALL_OCR:-true}
    image: ${MEDIA_IMAGE:-media-mcp:local}
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment: &media-environment
      MEDIA_AUTH_MODE: ${MEDIA_AUTH_MODE:-none}
      MEDIA_BIND_HOST: ${MEDIA_LAN_BIND:-0.0.0.0}
      MEDIA_MCP_PORT: ${MEDIA_MCP_PORT:-18210}
      MEDIA_DB_PATH: /state/media.sqlite3
      QBITTORRENT_URL: http://127.0.0.1:${MEDIA_QBITTORRENT_PORT:-18211}
      QBITTORRENT_USERNAME: ""
      QBITTORRENT_PASSWORD: ""
      JACKETT_URL: http://127.0.0.1:${MEDIA_JACKETT_PORT:-18212}
      JACKETT_API_KEY: ""
      JACKETT_CONFIG_FILE: /services/jackett/Jackett/ServerConfig.json
      CODEX_APP_SERVER_TOKEN_FILE: /run/secrets/codex-app-server-token
    volumes: &media-volumes
      - ${MEDIA_DATA_DIR:-./data}:/data
      - ${MEDIA_STATE_PATH:-./state}:/state
      - ${MEDIA_SERVICES_DIR:-./services}/jackett:/services/jackett:ro
      - type: bind
        source: ${CODEX_TOKEN_FILE:-./state/codex-token}
        target: /run/secrets/codex-app-server-token
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      qbittorrent:
        condition: service_healthy
      jackett:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('MEDIA_MCP_PORT','18210')+'/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *media-logging
  worker:
    image: ${MEDIA_IMAGE:-media-mcp:local}
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment: *media-environment
    volumes: *media-volumes
    command: ["media-worker"]
    depends_on:
      mcp:
        condition: service_healthy
    stop_grace_period: 30s
    cpus: 1
    healthcheck:
      test: ["CMD", "python3", "-m", "media_mcp.monitor.health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *media-logging
